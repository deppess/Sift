name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test
        run: swift test
      - name: Integration tests
        run: ./Scripts/test-integration
      - name: Release build
        run: swift build -c release
